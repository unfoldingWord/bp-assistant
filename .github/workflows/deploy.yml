name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm no pipeline is currently running (yes/no)'
        required: true
        default: 'yes'
      skip_pipeline_check:
        description: 'Bypass /health/pipelines guard (use only if bot is unreachable)'
        required: false
        default: 'no'

# Serialize deploys to the single uw-bt-bot machine. Two `flyctl deploy --strategy
# immediate` runs racing on the same machine is what caused the 2026-07 outage:
# the skills repo auto-dispatched this workflow on a PR merge and a human manually
# dispatched it ~4s later; both hit `machine is replacing: concurrent update in
# progress`, and that churn saturated Fly's machine-start rate limit, which then
# combined with `auto_start_machines=true` + inbound traffic into a proxy
# auto-start storm the machine could never boot out of.
#
# cancel-in-progress is intentionally FALSE: a second deploy QUEUES behind the
# first and runs only after it fully finishes. Cancelling an in-flight
# immediate-strategy deploy would leave the machine half-replaced — the exact
# damaged state we are preventing — so we must let the first one complete.
concurrency:
  group: deploy-uw-bt-bot
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'yes' }}
    env:
      HEALTH_URL: https://uw-bt-bot.fly.dev/health/pipelines
      MAX_WAIT_MINUTES: '150'
      # Number of consecutive active:0 reads (~60s apart) required before
      # deploying. Guards against the inter-phase race where a multi-phase
      # run (e.g. notes -> tqs) transiently has no running checkpoint between
      # phases and a single poll reads active:0.
      CLEAR_CONFIRMATIONS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wait for active pipelines to clear
        if: ${{ github.event.inputs.skip_pipeline_check != 'yes' }}
        run: |
          set -u
          deadline=$(( $(date +%s) + MAX_WAIT_MINUTES * 60 ))
          unreachable=0
          clear_streak=0
          while :; do
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::Active pipelines did not clear within ${MAX_WAIT_MINUTES} minutes. Use workflow_dispatch with skip_pipeline_check=yes to override after manual verification."
              exit 1
            fi
            http_code=$(curl -sS -o /tmp/health.body -w '%{http_code}' --max-time 30 "$HEALTH_URL" || echo "000")
            if [ "$http_code" = "404" ]; then
              echo "::warning::$HEALTH_URL returned 404 — running bot does not expose the guard endpoint. Proceeding with deploy."
              break
            fi
            if [ "$http_code" != "200" ]; then
              unreachable=$((unreachable + 1))
              echo "Could not reach $HEALTH_URL (HTTP ${http_code}, attempt ${unreachable})"
              if [ "$unreachable" -ge 5 ]; then
                echo "::error::$HEALTH_URL unreachable after 5 attempts. If the bot is crashed, re-run via workflow_dispatch with skip_pipeline_check=yes."
                exit 1
              fi
              sleep 30
              continue
            fi
            body="$(cat /tmp/health.body)"
            unreachable=0
            active=$(echo "$body" | jq -r '.active')
            if [ "$active" = "0" ]; then
              clear_streak=$((clear_streak + 1))
              if [ "$clear_streak" -ge "$CLEAR_CONFIRMATIONS" ]; then
                echo "No active pipelines (${clear_streak} consecutive checks). Proceeding with deploy."
                echo "$body" | jq -r '"Bot up since " + .processStartedAt'
                break
              fi
              echo "No active pipelines (${clear_streak}/${CLEAR_CONFIRMATIONS}). Reconfirming in 60s to rule out an inter-phase gap."
              sleep 60
              continue
            fi
            clear_streak=0
            echo "Active pipelines: $active. Rechecking in 60s."
            echo "$body" | jq -r '.pipelines[] | "  - " + .pipelineType + " " + (.scope | tostring) + " (age " + (.ageSeconds | tostring) + "s)"'
            sleep 60
          done

      - name: Deploy
        run: flyctl deploy --remote-only --strategy immediate --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
