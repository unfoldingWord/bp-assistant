name: Review Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: review-gate-bp-assistant-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # `checks: write` lets the timeout path publish a distinctly-named
  # `review-verdict-unavailable` check run, so an unread verdict is visibly
  # different from a FAIL verdict in the checks list rather than only in the
  # job log. See "Read review result from logs".
  checks: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Per-PR group prevents the cross-PR queue-eviction bug: GitHub Actions
    # only ever holds one pending entry per concurrency group, so a single
    # shared group across all PRs would let any new push silently evict a
    # pending review-gate run for another PR. Cross-PR serialization on the
    # Fly machine is enforced by the "Wait for machine to be stopped" step,
    # which acts as a Fly-API level lock.
    concurrency:
      group: bp-assistant-auto-issue-handler-fly-machine-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Resolve the reviewer machine ID dynamically. Fly deploys with
      # --strategy immediate destroy and recreate the machine, so any
      # FLY_MACHINE_ID secret goes stale on every deploy. Look it up at
      # runtime instead.
      - name: Resolve reviewer machine ID
        id: resolve
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          test -n "$FLY_APP_NAME"
          machine_id="$(flyctl machines list --app "$FLY_APP_NAME" --json \
            | node -e "let s=''; process.stdin.on('data',c=>s+=c); process.stdin.on('end',()=>{ try { const j=JSON.parse(s); const m=Array.isArray(j)?j.find(x=>x&&x.id&&String(x.state||'').toLowerCase()!=='destroyed'):null; if (m) process.stdout.write(m.id); } catch {} });")"
          if [ -z "$machine_id" ]; then
            echo "Could not resolve a non-destroyed machine for app $FLY_APP_NAME" >&2
            flyctl machines list --app "$FLY_APP_NAME" >&2 || true
            exit 1
          fi
          echo "Resolved reviewer machine: $machine_id"
          echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"

      # Cross-workflow Fly-machine lock, implemented as a compare-and-swap
      # lease on the machine's own env config. The single reviewer machine is
      # shared across every PR's review-gate run (and the hourly cron), and the
      # per-PR concurrency group above deliberately does NOT serialize distinct
      # PRs against each other. The old "wait for stopped, then separately
      # configure + start" sequence had a TOCTOU gap: two runs could both
      # observe `stopped` at the same instant, both reconfigure+start the one
      # machine, and knock it into Fly's `replacing` state -- failing both runs
      # with a cryptic "entered failure state: replacing".
      #
      # Instead we wait for `stopped`, write our PR's env (the claim), then read
      # the config back. PR_REVIEW_HEAD_SHA is unique per run, so it doubles as
      # the lease token: if the readback shows our SHA we won the machine; if it
      # shows another run's SHA we lost the race, so we back off and retry the
      # whole acquire -- by then the winner has started the machine, so the
      # wait-for-stopped blocks us until it finishes. Verdicts stay correct
      # regardless of any residual race because "Read review result" scopes
      # strictly on our head SHA, so the worst case is a clean, clearly-messaged
      # failure, never a mis-attributed verdict.
      #
      # The reviewer Fly machine is one-shot: starting it runs run-hourly-once.sh
      # and exits when the script returns. We can't SSH into a stopped machine,
      # so driving it means writing env vars, starting it, waiting for it to
      # exit, then reading the JSON marker out of the logs.
      - name: Acquire reviewer machine (claim + verify)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          FLY_MACHINE_ID: ${{ steps.resolve.outputs.machine_id }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_PROVIDER: claude
        run: |
          set -euo pipefail
          get_state() {
            flyctl machines list --app "$FLY_APP_NAME" --json 2>/dev/null \
              | node -e "let s=''; process.stdin.on('data',c=>s+=c); process.stdin.on('end',()=>{ try { const j=JSON.parse(s); const m=Array.isArray(j)?j.find(x=>x&&x.id===process.argv[1]):null; if (m) process.stdout.write(String(m.state||'')); } catch {} });" \
                "$FLY_MACHINE_ID" \
              || echo ""
          }
          # Read back the lease token (PR_REVIEW_HEAD_SHA) from the machine's
          # committed env config so we can tell whether our claim actually stuck.
          get_owner() {
            flyctl machines list --app "$FLY_APP_NAME" --json 2>/dev/null \
              | node -e "let s=''; process.stdin.on('data',c=>s+=c); process.stdin.on('end',()=>{ try { const j=JSON.parse(s); const m=Array.isArray(j)?j.find(x=>x&&x.id===process.argv[1]):null; const e=m&&m.config?m.config.env:null; if (e) process.stdout.write(String(e.PR_REVIEW_HEAD_SHA||'')); } catch {} });" \
                "$FLY_MACHINE_ID" \
              || echo ""
          }
          # --restart no keeps the machine from auto-looping on non-zero exits,
          # so the completion poll observes a clean terminal state.
          claim() {
            flyctl machine update "$FLY_MACHINE_ID" --app "$FLY_APP_NAME" --yes --skip-start --restart no \
              --env "RUN_MODE=pr-review" \
              --env "PR_REVIEW_REPO=${REVIEW_REPO}" \
              --env "PR_REVIEW_NUMBER=${REVIEW_PR}" \
              --env "PR_REVIEW_BASE_SHA=${REVIEW_BASE}" \
              --env "PR_REVIEW_HEAD_SHA=${REVIEW_HEAD}" \
              --env "PR_REVIEW_PROVIDER=${REVIEW_PROVIDER}"
          }
          deadline=$((SECONDS + 1800))
          acquired=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            state="$(get_state)"
            if [ "$state" != "stopped" ]; then
              # Another run (or the hourly cron) holds the machine; wait it out.
              sleep 10
              continue
            fi
            if ! claim; then
              echo "Claim update failed (transient Fly API error); retrying..."
              sleep 10
              continue
            fi
            # Let a racing writer's update propagate to the API, then confirm we
            # hold the lease. Fly's list is eventually consistent, so this
            # narrows -- but does not fully close -- the claim race; the head-SHA
            # scoping in "Read review result" is the actual correctness backstop.
            sleep 8
            owner="$(get_owner)"
            if [ "$owner" = "$REVIEW_HEAD" ]; then
              echo "Acquired reviewer machine for PR #${REVIEW_PR} (${REVIEW_HEAD})."
              acquired=1
              break
            fi
            echo "Lost claim race (machine now leased to '${owner:-<none>}'); backing off and retrying."
            sleep 15
          done
          if [ "$acquired" != "1" ]; then
            echo "Could not acquire the reviewer machine within ~30m; another workflow may be holding it." >&2
            exit 1
          fi

      - name: Start machine and wait for completion
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          FLY_MACHINE_ID: ${{ steps.resolve.outputs.machine_id }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          flyctl machine start "$FLY_MACHINE_ID" --app "$FLY_APP_NAME"

          # Poll until the machine leaves stopped — confirms the Fly control plane
          # accepted the start. A fixed sleep is unreliable when the plane is under
          # load; require an actual state transition before watching for completion.
          get_state() {
            flyctl machines list --app "$FLY_APP_NAME" --json 2>/dev/null \
              | node -e "let s=''; process.stdin.on('data',c=>s+=c); process.stdin.on('end',()=>{ try { const j=JSON.parse(s); const m=Array.isArray(j)?j.find(x=>x&&x.id===process.argv[1]):null; if (m) process.stdout.write(String(m.state||'')); } catch {} });" \
                "$FLY_MACHINE_ID" \
              || echo ""
          }
          get_owner() {
            flyctl machines list --app "$FLY_APP_NAME" --json 2>/dev/null \
              | node -e "let s=''; process.stdin.on('data',c=>s+=c); process.stdin.on('end',()=>{ try { const j=JSON.parse(s); const m=Array.isArray(j)?j.find(x=>x&&x.id===process.argv[1]):null; const e=m&&m.config?m.config.env:null; if (e) process.stdout.write(String(e.PR_REVIEW_HEAD_SHA||'')); } catch {} });" \
                "$FLY_MACHINE_ID" \
              || echo ""
          }

          launch_deadline=$((SECONDS + 60))
          state=""
          while [ "$SECONDS" -lt "$launch_deadline" ]; do
            state="$(get_state)"
            # Treat empty as non-conclusive (transient Fly API error). Only break
            # once we've observed an actual non-stopped state; otherwise an empty
            # response would falsely satisfy the != "stopped" check.
            if [ -n "$state" ] && [ "$state" != "stopped" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$state" ] || [ "$state" = "stopped" ]; then
            echo "Machine did not leave stopped state within 60s (last state: ${state:-<unknown>}); Fly control plane may be unresponsive." >&2
            exit 1
          fi

          # Ownership recheck: if another run re-leased the machine in the brief
          # window between our claim-verify and this start, it is now running a
          # different PR's review and our marker will never appear. Fail fast
          # with an actionable message instead of polling the full 15 minutes.
          owner="$(get_owner)"
          if [ -n "$owner" ] && [ "$owner" != "$REVIEW_HEAD" ]; then
            echo "Reviewer machine was re-leased to '${owner}' after our claim; this run lost the race and will not produce a result. Re-run the gate for this PR." >&2
            exit 1
          fi

          # Poll until the machine returns to a stopped state (entrypoint exited).
          # Cap at ~15 minutes; review runs typically finish in a few minutes.
          # `replacing` is a *transient* Fly state during a config update (e.g. a
          # racing run's claim landing), not a terminal failure, so wait it out
          # rather than aborting — treating it as fatal was the old spurious
          # cross-PR failure mode.
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            state="$(get_state)"
            case "$state" in
              stopped|destroyed)
                break
                ;;
              failed|crashed|error)
                echo "Fly machine entered failure state: $state" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "$state" != "stopped" ] && [ "$state" != "destroyed" ]; then
            echo "Machine did not return to stopped state within timeout (last state: $state)" >&2
            exit 1
          fi

      - name: Restore machine to default mode
        if: always() && steps.resolve.outputs.machine_id != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          FLY_MACHINE_ID: ${{ steps.resolve.outputs.machine_id }}
        run: |
          set -euo pipefail
          # Clear pr-review env vars so the next hourly cron triggers an hourly run,
          # not another pr-review against this PR.
          # Don't swallow restore failures. If this update fails the machine is
          # left configured for pr-review mode and will misbehave on the next
          # hourly run; surfacing the error gives an explicit signal to fix it.
          if ! flyctl machine update "$FLY_MACHINE_ID" --app "$FLY_APP_NAME" --yes --skip-start \
            --env "RUN_MODE=hourly" \
            --env "PR_REVIEW_REPO=" \
            --env "PR_REVIEW_NUMBER=" \
            --env "PR_REVIEW_BASE_SHA=" \
            --env "PR_REVIEW_HEAD_SHA=" \
            --env "PR_REVIEW_PROVIDER="; then
            echo "::warning::Failed to restore reviewer machine to default mode; manual intervention may be required (set RUN_MODE=hourly)." >&2
            exit 1
          fi

      - name: Read review result from logs
        id: review
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Extract the PR_REVIEW_RESULT marker for THIS PR head SHA from the
          # Fly logs. run-pr-review.js emits a single-line marker so we don't
          # need to reassemble multi-line pretty JSON across log entries.
          #
          # Fly's log pipeline is eventually-consistent: a single fetch right
          # after the machine stops often returns a stale snapshot that predates
          # this run's marker (the machine is shared, so other PRs' markers may
          # be all that has propagated yet — which is exactly how this step used
          # to fail the run with no verdict). Poll, re-fetching, until this head
          # SHA's marker appears or we time out.
          #
          # Scope solely on headSha: a git SHA is globally unique, present in
          # both the success marker (executePrReview's request block) and the
          # failure/fallback markers, and correctly distinguishes re-pushes of
          # the same PR number.
          #
          # The window is 10 minutes, not the original 3: back-to-back reviews on
          # the shared machine were timing out at 180s and failing green PRs with
          # a red gate (#282). A longer wait costs nothing when the marker lands
          # early (we break immediately) and each spurious failure costs a full
          # reviewer pass off the weekly Claude allowance on re-trigger.
          #
          # The window also ADAPTS. The reviewer shares one Fly machine with the
          # live notes/generate pipelines, so "no marker yet" is very often
          # "the host is busy", not "the review failed" (#324: a 600s timeout
          # while `/health/pipelines` reported active=1 for a NUM 26 run, while
          # two sibling PRs opened minutes earlier both passed in 4-7m). Before
          # giving up we ask the bot whether it is still working; if it is, we
          # keep waiting up to a hard cap instead of declaring a timeout.
          poll_window=600
          max_window=1800
          started=$SECONDS
          deadline=$((SECONDS + poll_window))
          marker_line=""
          attempt=0
          fetch_failures=0
          busy_extensions=0
          last_active=""
          # Same host the reviewer runs on; the health endpoint reports which
          # pipelines are currently checkpointed as running.
          #
          # Two caveats, both deliberate:
          #  - This probe is NOT read-only. fly.toml sets auto_start_machines,
          #    so hitting the endpoint can wake the (now RUN_MODE=hourly)
          #    machine. deploy.yml already polls the same endpoint, and a fresh
          #    process still reports the volume-persisted checkpoints, so the
          #    answer stays usable.
          #  - We count only pipelines with `interrupted !== true`, not the
          #    top-level `active`. `active` includes stale `running` checkpoints
          #    left behind by a crashed pipeline, which would buy a dead
          #    reviewer the full 30-minute extension budget for nothing.
          health_url="https://${FLY_APP_NAME}.fly.dev/health/pipelines"
          get_active() {
            curl -sf --max-time 15 "$health_url" 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const p=Array.isArray(j.pipelines)?j.pipelines:null;if(p)process.stdout.write(String(p.filter(x=>x&&x.interrupted!==true).length));}catch{}});" \
              || echo ""
          }
          # Called from both the fetch-failure and no-marker paths: a flaky Fly
          # log API is plausibly correlated with a busy host, so the one case
          # where extending is most defensible must not skip the check.
          maybe_extend() {
            [ "$SECONDS" -ge "$deadline" ] || return 0
            cap=$((started + max_window))
            [ "$SECONDS" -lt "$cap" ] || return 0
            last_active="$(get_active)"
            [ -n "$last_active" ] && [ "$last_active" != "0" ] || return 0
            deadline=$((SECONDS + 120))
            # Never overshoot the cap -- otherwise "hard cap ${max_window}s" in
            # the log line is a lie by up to one full extension.
            [ "$deadline" -le "$cap" ] || deadline=$cap
            busy_extensions=$((busy_extensions + 1))
            echo "Reviewer host reports ${last_active} live pipeline(s); extending the wait (extension #${busy_extensions}, hard cap ${max_window}s total)."
          }
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            # Don't swallow the fetch status: a run of failed `flyctl logs` calls
            # (rate limiting, expired token, Fly API outage) is a different
            # diagnosis from "the marker has not propagated yet", and the old
            # `|| true` made the two indistinguishable in the timeout report.
            if ! flyctl logs --app "$FLY_APP_NAME" --no-tail > all-logs.txt 2>&1; then
              fetch_failures=$((fetch_failures + 1))
              echo "flyctl logs fetch failed (attempt ${attempt}); retrying in 10s..."
              sleep 10
              maybe_extend
              continue
            fi
            marker_line="$(grep -E 'PR_REVIEW_RESULT:[[:space:]]*\{' all-logs.txt \
              | grep "\"headSha\":\"${HEAD_SHA}\"" \
              | tail -1 || true)"
            if [ -n "$marker_line" ]; then
              echo "Found PR_REVIEW_RESULT marker for SHA ${HEAD_SHA} on attempt ${attempt}."
              break
            fi
            echo "No marker yet for SHA ${HEAD_SHA} (attempt ${attempt}); waiting 10s for Fly log propagation..."
            sleep 10
            # About to give up? Ask whether the shared host is still busy first.
            maybe_extend
          done
          if [ -z "$marker_line" ]; then
            # This is a retrieval timeout, NOT a review verdict. Say so plainly:
            # the previous wording ("the reviewer machine likely never emitted a
            # result") plus a 100-line dump of whatever was in the shared log
            # snapshot -- often another PR's review text -- read as though the
            # gate had reviewed the wrong PR and failed it. It had not, and it
            # cannot: the match above is scoped on this PR's head SHA.
            waited=$((SECONDS - started))
            {
              echo "TIMEOUT reading the review result: no PR_REVIEW_RESULT marker for SHA ${HEAD_SHA} appeared in the Fly log snapshot within ~${waited}s (${attempt} attempts, ${fetch_failures} failed log fetches, ${busy_extensions} busy-host extensions; last reported active pipelines: ${last_active:-<unknown>})."
              echo
              echo "This is NOT a review verdict. The reviewer did not report FAIL --"
              echo "no verdict for this commit could be read at all. Re-run this workflow"
              echo "to retry; the diff itself has not been judged by this run."
              echo
              if [ "$fetch_failures" = "$attempt" ]; then
                echo "Every log fetch failed, so the Fly API (not log propagation) is the"
                echo "likely cause. Last flyctl output:"
                tail -20 all-logs.txt >&2 || true
              else
                echo "Head SHAs of the review markers that HAD propagated into the snapshot"
                echo "(listed as propagation evidence only -- these belong to other runs and"
                echo "have no bearing on this PR's verdict):"
                grep -E 'PR_REVIEW_RESULT:[[:space:]]*\{' all-logs.txt \
                  | grep -oE '"headSha":"[0-9a-f]{7,40}"' \
                  | sort -u \
                  | sed 's/^/  /' || echo "  (none)"
              fi
            } >&2

            # Leave the explanation where a human will actually see it. The
            # careful paragraph above only exists inside the job log, which is
            # why a busy-host timeout kept reading as "your code was rejected".
            {
              echo "<!-- bp-review-gate -->"
              echo "## Remote Review Gate -- no verdict available"
              echo
              echo "- Decision: **UNKNOWN (not a rejection)**"
              echo "- Commit: ${HEAD_SHA}"
              echo
              echo "The reviewer's result marker for this commit could not be read within"
              echo "~${waited}s (${attempt} polls, ${busy_extensions} extensions while the shared"
              echo "reviewer host reported active pipelines; last reported active: ${last_active:-unknown})."
              echo
              echo "**This is not a review verdict.** The reviewer did not report FAIL -- this"
              echo "diff was not judged by this run. Re-run the Review Gate workflow to retry."
              echo
              echo "The checks list carries a separate \`review-verdict-unavailable\` entry for"
              echo "this commit. That entry -- not the red \`review\` row -- is what happened here."
            } > timeout-comment.md
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file timeout-comment.md \
              || echo "::warning::Could not post the no-verdict comment to PR #${PR_NUMBER}."

            # Publish a separately-NAMED check run so the checks list itself
            # distinguishes "couldn't read a verdict" from "reviewer said FAIL".
            #
            # Why a distinct name rather than concluding this job as `neutral`
            # or `cancelled`:
            #  - a step cannot set its own job's conclusion to `neutral`, and
            #    `neutral` counts as PASSING for required status checks, so it
            #    could later read as approval;
            #  - `cancelled` is already taken. This workflow sets
            #    `cancel-in-progress: true`, so a grey `cancelled` row already
            #    means "superseded by a newer push" -- routine and ignorable.
            #    Reusing it would move the ambiguity, not remove it.
            # A distinct name collides with nothing and says what happened.
            gh api -X POST "repos/${REPO}/check-runs" \
              -f name='review-verdict-unavailable' \
              -f head_sha="$HEAD_SHA" \
              -f status='completed' \
              -f conclusion='neutral' \
              -f 'output[title]=No review verdict could be read (not a rejection)' \
              -f "output[summary]=The reviewer's result marker for ${HEAD_SHA} did not appear within ~${waited}s (${attempt} polls, ${busy_extensions} busy-host extensions). The reviewer did not report FAIL -- this diff was not judged by this run. Re-run the Review Gate workflow to retry." \
              > /dev/null \
              || echo "::warning::Could not publish the review-verdict-unavailable check run."

            # The `review` job itself still FAILS. A verdict we could not read is
            # never permission to merge, and this repo has no required-status-check
            # rule to fall back on -- red is the only thing that reliably reads as
            # "not ready". The comment and the named check run above are what tell
            # a human that the red row is a retrieval failure, not a rejection.
            exit 1
          fi
          review_json="$(printf '%s\n' "$marker_line" | sed -E 's/^.*PR_REVIEW_RESULT:[[:space:]]*//')"
          printf '%s\n' "$review_json" > review-result.json
          decision="$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('review-result.json','utf8')); process.stdout.write(String(d.decision||''));")"
          summary="$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('review-result.json','utf8')); process.stdout.write(String(d.summary||''));")"
          {
            echo 'decision<<EOF'
            echo "$decision"
            echo EOF
            echo 'summary<<EOF'
            echo "$summary"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish Summary
        env:
          SUMMARY: ${{ steps.review.outputs.summary }}
          DECISION: ${{ steps.review.outputs.decision }}
        run: |
          {
            echo "## Remote Review Gate"
            echo
            echo "- Decision: ${DECISION}"
            echo
            printf '%s\n' "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR
        uses: actions/github-script@v8
        env:
          SUMMARY: ${{ steps.review.outputs.summary }}
          DECISION: ${{ steps.review.outputs.decision }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            // One new comment per run (not an upsert of a single sticky comment) so
            // rapid-fire pushes each leave a visible, timestamped verdict in the PR
            // timeline instead of silently overwriting the previous run's comment.
            const marker = '<!-- bp-review-gate -->';
            const body = [
              marker,
              '## Remote Review Gate',
              '',
              `- Decision: ${process.env.DECISION}`,
              `- Commit: ${process.env.HEAD_SHA}`,
              '',
              process.env.SUMMARY,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Enforce Gate
        env:
          DECISION: ${{ steps.review.outputs.decision }}
        run: |
          test "$DECISION" = "PASS"
