name: Tests

# Runs the unit suite on every PR and on main.
#
# ADVISORY MODE (current): this job never reports failure, even when tests fail.
# Results go to the run summary. Do not remove the advisory machinery until the
# suite is green on Linux -- it is load-bearing, see WHY below.
#
# WHY advisory: review-gate-automerge.yml treats any check run on the PR head
# SHA whose conclusion is not success/neutral/skipped as fatal -- see its
# `okConclusions` set (line 62) and the `checkFailed` branch (line 92) that
# calls core.setFailed. Check runs from a pull_request workflow attach to the PR
# HEAD sha (confirmed via the check-runs API), which is exactly the ref
# automerge polls. So a red check here stalls automerge on every PR and blocks
# the agent pipeline. The suite is known-red on Linux today: ~230 call sites
# across 10 test files write to hardcoded production paths (/srv/bot/workspace,
# /data/workspace) that do not exist on a runner, failing with EACCES.
#
# Advisory is enforced in TWO independent places, deliberately redundant because
# each covers a failure the other does not:
#   1. `continue-on-error: true` on the job -- covers steps outside the test
#      step. Without it, a transient `npm ci` or setup-node failure concludes
#      the check as failure and kills automerge. That inversion (infra noise
#      fatal, real test failures ignored) is the trap this guards.
#   2. `exit 0` in the test step -- keeps the step itself green so the common
#      case does not depend on continue-on-error's exact conclusion semantics.
#
# Flipping to hard-fail (remove both, then make this a required check) is a
# deliberate later step, after the tests move to temp dirs. That flip is what
# starts gating merges and deploys.
#
# On pull_request, actions/checkout resolves refs/pull/N/merge -- the PR already
# merged into the base -- so this tests the MERGE RESULT, not the branch head.
# That is the case nothing was checking: #274 and #275 were each green alone and
# broke main together.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

# cancel-in-progress is deliberately FALSE. A cancelled run concludes as
# `cancelled`, which is not in automerge's okConclusions -- and `reopened` /
# `ready_for_review` fire WITHOUT changing the head SHA, so a cancelled run
# would strand a fatal check on the very SHA automerge inspects, with the drift
# guard unable to excuse it. Letting duplicate runs finish is far cheaper than
# stalling the merge pipeline.
#
# The group is also distinct from the review-gate groups on purpose: GitHub
# holds only one pending entry per group, so sharing one would let these
# workflows evict each other's queued runs.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # See "ADVISORY MODE" above. This is the outer guard.
    continue-on-error: true

    # NOTE: the timeouts live on the STEPS, not here. A job-level
    # `timeout-minutes` concludes the check as `timed_out`, which is not in
    # automerge's okConclusions -- and continue-on-error does not rescue it,
    # because it only prevents a *failed* job from failing the run, not a
    # cancelled/timed-out one. A step-level timeout instead fails the step,
    # which fails the job, which continue-on-error then converts to success.
    #
    # The budget matters: automerge waits only 10 minutes for checks to
    # complete (review-gate-automerge.yml line 60) and treats a still-running
    # check as pending (line 91), so a hang must resolve inside that window.
    # Step timeouts below sum to ~7 minutes for the two steps that can
    # realistically hang. The suite itself takes seconds.

    # Matches review-gate.yml's guard. Skipped jobs conclude as `skipped`, which
    # automerge tolerates.
    if: ${{ !github.event.pull_request.draft }}

    steps:
      # Every step that touches the network is bounded, for the reason in the
      # NOTE above: an unbounded hang anywhere leaves the check pending past
      # automerge's 10-minute budget, which fails it just as surely as a red
      # conclusion would.
      - uses: actions/checkout@v4
        timeout-minutes: 2

      # Node 22 matches the Dockerfile build stage (`FROM node:22-slim`). Keep
      # these in step: a suite that passes here but not in the image is worse
      # than no signal at all.
      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        timeout-minutes: 4

      - name: Run tests (advisory -- does not gate)
        timeout-minutes: 3
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e

          counts=$(grep -E '^(# )?(tests|pass|fail|cancelled|skipped) [0-9]+' test-output.log | tail -10)
          failures=$(grep -E '^not ok' test-output.log | head -40)

          {
            echo "## Test results"
            echo
            if [ "$status" -eq 0 ]; then
              echo ":white_check_mark: Suite passed."
              echo
              echo "The suite is green. It is now worth taking this job out of advisory"
              echo "mode and making it a required check -- see the header comment in"
              echo ".github/workflows/test.yml for what that involves."
            else
              echo ":x: Suite failed (exit $status) -- **not blocking**, this job is advisory."
              echo
              echo "Advisory mode is intentional while the hardcoded-production-path"
              echo "migration is in flight. See .github/workflows/test.yml."
            fi
            echo
            echo '```'
            echo "${counts:-(no test counts found -- did the suite start?)}"
            echo '```'
            echo
            echo "<details><summary>Failing tests</summary>"
            echo
            echo '```'
            echo "${failures:-(none)}"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Inner guard -- see "ADVISORY MODE" in the header.
          exit 0

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 14
