app = "uw-bt-bot"
primary_region = "dfw"

kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.fly"

[deploy]
  # Refresh the /data/workspace skills checkout to origin/main on every deploy.
  # See scripts/refresh-workspace.sh — stash→ff→pop so runtime-appended decision
  # CSVs (and a root-owned .git) never freeze the checkout again as they did for
  # 124 commits. Always exits 0 so it can't fail the deploy.
  release_command = "bash /app/scripts/refresh-workspace.sh"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  CSKILLBP_DIR = "/data/workspace"
  DOOR43_REPOS_PATH = "/data/workspace/door43-repos"
  HEBREW_DIR = "/data/workspace/data/hebrew_bible"
  CLAUDE_CONFIG_DIR = "/data/claude-config"
  MODEL_PROVIDER_CONFIG_FILE = "/config/model-provider-config.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[[mounts]]
  source = "workspace_vol"
  destination = "/data"
  initial_size = "25gb"
