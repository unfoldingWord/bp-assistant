app = "uw-bt-bot"
primary_region = "dfw"

kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.fly"

# NOTE: the /data/workspace skills refresh is intentionally NOT a release_command.
# Fly release commands run in an ephemeral machine with NO volumes mounted, so
# refresh-workspace.sh only ever saw a missing /data/workspace and skipped,
# freezing the bot on stale skills. It now runs from entrypoint.sh on the live,
# volume-bearing machine (fires on every immediate-strategy deploy, at boot).

[env]
  NODE_ENV = "production"
  PORT = "8080"
  CSKILLBP_DIR = "/data/workspace"
  DOOR43_REPOS_PATH = "/data/workspace/door43-repos"
  HEBREW_DIR = "/data/workspace/data/hebrew_bible"
  CLAUDE_CONFIG_DIR = "/data/claude-config"
  MODEL_PROVIDER_CONFIG_FILE = "/config/model-provider-config.json"
  BP_GUARD_HOOKS = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[[mounts]]
  source = "workspace_vol"
  destination = "/data"
  initial_size = "25gb"
